<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Rubina! ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #e8dbfc, #f3e8ff, #d6c4f9);
            background-size: 300% 300%;
            animation: gradientBG 12s ease infinite;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #3b2a54;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 35px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(157, 92, 255, 0.15), 0 1px 3px rgba(0,0,0,0.05);
            max-width: 420px;
            width: 90%;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 2;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(157, 92, 255, 0.25);
        }
        h1 { 
            color: #8b5cf6;
            font-size: 32px; 
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            transition: all 0.3s ease;
        }
        p { 
            font-size: 17px; 
            line-height: 1.6; 
            font-weight: 600;
            color: #554372;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease, transform 0.3s ease;
            margin-bottom: 10px;
        }
        .text-fade {
            opacity: 0;
            transform: scale(0.95);
        }
        .cat-container {
            height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.5s ease-in-out;
            transform: scale(0.7);
        }
        .cat-container.show {
            height: 90px;
            opacity: 1;
            transform: scale(1);
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .cat-container img {
            height: 100%;
            object-fit: contain;
        }
        button {
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
            transition: all 0.3s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            box-shadow: 0 12px 24px rgba(139, 92, 246, 0.5);
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(1px);
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
        }
        button.hide-btn {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }

        /* ===== Final sparkle / firework overlay ===== */
        .sparkle-field {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        .sparkle {
            position: absolute;
            font-size: 22px;
            opacity: 0;
            animation: twinkle 2.4s ease-in-out infinite;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.9));
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
        }
        .final-msg {
            margin-top: 16px;
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(90deg, #8b5cf6, #d946ef, #f59e0b, #8b5cf6);
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 3s linear infinite, fadeInUp 0.8s ease forwards;
            opacity: 0;
            min-height: auto;
        }
        @keyframes shimmer {
            to { background-position: 300% center; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- floating background sparkles, populated on finale -->
    <div class="sparkle-field" id="sparkle-field"></div>

    <div class="card">
        <h1 id="card-title">✨ Hey Look!</h1>
        <p id="wish-text">SUR... SURPRISE... 🤩</p>
        
        <!-- Dancing Happy Cat GIF -->
        <div id="cat-box" class="cat-container">
            <img src="https://media.giphy.com/media/3o7TKsQ8UQ1bC1y3CU/giphy.gif" alt="Dancing Happy Cat">
        </div>

        <div id="final-msg" class="final-msg"></div>

        <button id="action-btn" onclick="celebrate()">NEXT</button>
    </div>

    <script>
        // Story steps
        const messages = [
            "SUR... SURPRISE... 🤩",
            "I wrote a tiny piece of code to deliver a  best wishes just for you... 💻🤖",
            "Wishing you a year full of infinite happiness, grand success! Thanks for being an amazing friend. 🎂🎉✨"
        ];
        
        let currentStep = 0;

        function celebrate() {
            const textEl = document.getElementById('wish-text');
            const btnEl = document.getElementById('action-btn');
            const titleEl = document.getElementById('card-title');

            currentStep++;

            if (currentStep < messages.length) {
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 30, spread: 50, colors: ['#c0a5ff', '#a78bfa'], origin: { y: 0.6 } });
                }

                textEl.classList.add('text-fade');
                setTimeout(() => {
                    textEl.innerHTML = messages[currentStep];
                    textEl.classList.remove('text-fade');

                    if (currentStep === messages.length - 1) {
                        titleEl.innerHTML = "🎉 Happy Birthday!";
                        btnEl.innerHTML = "nextttt ✨";
                    }
                }, 250);

            } else {
                // Final screen upgrade!
                titleEl.innerHTML = "👑 Birthday Girl";
                textEl.innerHTML = "Have an incredible day, Rubina! You deserve the absolute best. 💜✨";
                btnEl.classList.add('hide-btn');

                // Reveal final shimmering wish
                const finalMsg = document.getElementById('final-msg');
                finalMsg.innerHTML = "Sending you all the magic, sparkle, and joy in the world! 🌟💫🎆";

                // Launch the big firework + sparkle finale
                launchFinale();
            }
        }

        // Custom function to create tiny sparkling purple & gold star flakes
        function fireStarShower() {
            if (typeof confetti === 'function') {
                var defaults = { 
                    spread: 360, 
                    ticks: 60, 
                    gravity: 0.4, 
                    decay: 0.94, 
                    startVelocity: 30, 
                    shapes: ['star'], 
                    colors: ['#D6C4F9', '#FFF5E4', '#FFEBB7', '#E8DBFC', '#A78BFA'] 
                };
                confetti({ ...defaults, particleCount: 50, scalar: 1.3 });
                confetti({ ...defaults, particleCount: 25, scalar: 0.8 });
            }
        }

        // ===== Final firework + floating sparkle finale =====
        function launchFinale() {
            // 1. Floating ambient sparkles (emoji) across the screen
            const field = document.getElementById('sparkle-field');
            const sparkleChars = ['✨', '💫', '⭐', '🌟', '💜'];
            for (let i = 0; i < 35; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                s.textContent = sparkleChars[Math.floor(Math.random() * sparkleChars.length)];
                s.style.left = Math.random() * 100 + 'vw';
                s.style.top = Math.random() * 100 + 'vh';
                s.style.animationDelay = (Math.random() * 2.4) + 's';
                s.style.fontSize = (14 + Math.random() * 22) + 'px';
                field.appendChild(s);
            }

            // 2. Firework bursts using canvas-confetti
            if (typeof confetti !== 'function') return;

            // Big celebratory star shower right away
            fireStarShower();

            // Repeated firework "shells" launching from random spots for a few seconds
            const fireworkColors = ['#8b5cf6', '#d946ef', '#f59e0b', '#ffffff', '#a78bfa', '#facc15'];
            let bursts = 0;
            const fireworkInterval = setInterval(() => {
                bursts++;
                confetti({
                    particleCount: 80,
                    startVelocity: 35,
                    spread: 360,
                    ticks: 70,
                    gravity: 0.6,
                    decay: 0.92,
                    scalar: 1.1,
                    origin: {
                        x: 0.15 + Math.random() * 0.7,
                        y: 0.2 + Math.random() * 0.4
                    },
                    colors: fireworkColors
                });
                if (bursts >= 8) clearInterval(fireworkInterval);
            }, 450);

            // Side cannons for a grand finale feel
            const end = Date.now() + 2500;
            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 60,
                    origin: { x: 0, y: 0.7 },
                    colors: fireworkColors
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 60,
                    origin: { x: 1, y: 0.7 },
                    colors: fireworkColors
                });
                if (Date.now() < end) requestAnimationFrame(frame);
            })();
        }

        // Ambient layout load burst
        window.onload = () => {
            setTimeout(() => {
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 25, spread: 40, colors: ['#a78bfa'], origin: { y: 0.6 } });
                }
            }, 500);
        };
    </script>
</body>
</html>
