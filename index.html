<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Rubina! ✨</title>
    <!-- Working, verified CDN link for confetti -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            /* Beautiful light purple / lavender gradient theme */
            background: linear-gradient(135deg, #e8dbfc, #f3e8ff, #d6c4f9);
            background-size: 300% 300%;
            animation: gradientBG 12s ease infinite;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #3b2a54;
            text-align: center;
            overflow: hidden;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 35px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(157, 92, 255, 0.15), 0 1px 3px rgba(0,0,0,0.05);
            max-width: 420px;
            width: 90%;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(157, 92, 255, 0.25);
        }
        h1 { 
            color: #8b5cf6; /* Modern Light Purple */
            font-size: 32px; 
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            transition: all 0.3s ease;
        }
        p { 
            font-size: 17px; 
            line-height: 1.6; 
            font-weight: 600;
            color: #554372;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease, transform 0.3s ease;
            margin-bottom: 10px;
        }
        .text-fade {
            opacity: 0;
            transform: scale(0.95);
        }
        .cat-container {
            height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.5s ease-in-out;
            transform: scale(0.7);
        }
        .cat-container.show {
            height: 90px;
            opacity: 1;
            transform: scale(1);
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .cat-container img {
            height: 100%;
            object-fit: contain;
        }
        button {
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
            transition: all 0.3s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            box-shadow: 0 12px 24px rgba(139, 92, 246, 0.5);
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(1px);
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="card-title">✨ Hey Look!</h1>
        <p id="wish-text">SUR... SURPRISE... 🤩</p>
        
        <!-- Dancing Happy Cat GIF -->
        <div id="cat-box" class="cat-container">
            <img src="https://giphy.com" alt="Dancing Happy Cat">
        </div>

        <button id="action-btn" onclick="celebrate()">NEXT</button>
    </div>

    <script>
        // Story steps
        const messages = [
            "SUR... SURPRISE... 🤩",
            "I wrote a tiny piece of code to deliver a highly optimized, bug-free wish just for you... 💻🤖",
            "Wishing you a year full of infinite happiness, grand success! Thanks for being an amazing friend. 🎂🎉✨"
        ];
        
        let currentStep = 0;

        function celebrate() {
            const textEl = document.getElementById('wish-text');
            const btnEl = document.getElementById('action-btn');
            const titleEl = document.getElementById('card-title');
            

            currentStep++;

            if (currentStep < messages.length) {
                // Gentle confetti click burst for middle steps
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 30, spread: 50, colors: ['#c0a5ff', '#a78bfa'], origin: { y: 0.6 } });
                }

                textEl.classList.add('text-fade');
                setTimeout(() => {
                    textEl.innerHTML = messages[currentStep];
                    textEl.classList.remove('text-fade');
                    
                    // Code execution steps transition
                    if (currentStep === messages.length - 1) {
                        titleEl.innerHTML = "🎉 Happy Birthday!";
                        btnEl.innerHTML = "nextttt ✨";
                      // Slide the dancing cat up
                       
                    }
                }, 250);

            } else {
                // Triggered when she taps the button for a final screen upgrade!
                titleEl.innerHTML = "👑 Birthday Girl";
                textEl.innerHTML = "Have an incredible day, Rubina! You deserve the absolute best. 💜✨";
                btnEl.innerHTML = "Keep Sparkling! 🌟";
             
            }
        }

        // Custom function to create tiny sparkling purple & gold star flakes
        function fireStarShower() {
            if (typeof confetti === 'function') {
                var defaults = { 
                    spread: 360, 
                    ticks: 60, 
                    gravity: 0.4, 
                    decay: 0.94, 
                    startVelocity: 30, 
                    shapes: ['star'], 
                    colors: ['#D6C4F9', '#FFF5E4', '#FFEBB7', '#E8DBFC', '#A78BFA'] 
                };
                confetti({ ...defaults, particleCount: 50, scalar: 1.3 });
                confetti({ ...defaults, particleCount: 25, scalar: 0.8 });
            }
        }

        // Ambient layout load burst
        window.onload = () => {
            setTimeout(() => {
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 25, spread: 40, colors: ['#a78bfa'], origin: { y: 0.6 } });
                }
            }, 500);
        };
    </script>
</body>
</html>
